[theme]
# Fonts are served from static/fonts (Geist, SIL Open Font License) so the app works offline.
font = "Geist, sans-serif"
headingFont = "Geist, sans-serif"
codeFont = "Geist Mono, monospace"
baseFontSize = 14
baseRadius = "medium"
showWidgetBorder = true
primaryColor = "#1E9E55"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-600-normal.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-700-normal.woff2"
weight = 700
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-latin-400-normal.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-latin-500-normal.woff2"
weight = 500
style = "normal"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-latin-600-normal.woff2"
weight = 600
style = "normal"

[theme.light]
backgroundColor = "#F2F3F1"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#141A17"
borderColor = "#E3E6E2"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F3F1"
textColor = "#3A443E"
borderColor = "#E3E6E2"

[theme.dark]
backgroundColor = "#0C100E"
secondaryBackgroundColor = "#161C19"
textColor = "#E4E9E5"
borderColor = "#252D29"

[theme.dark.sidebar]
backgroundColor = "#101512"
secondaryBackgroundColor = "#1A211D"
textColor = "#B9C3BD"
borderColor = "#232B27"

[client]
toolbarMode = "viewer"
showSidebarNavigation = true

[server]
enableStaticServing = true
maxUploadSize = 80
runOnSave = false

[browser]
gatherUsageStats = false
