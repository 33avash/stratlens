[theme]
base = "light"
primaryColor = "#1F3A5F"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#F2EEE7"
textColor = "#2B2B2B"
borderColor = "#E6E1D8"
baseRadius = "small"
showWidgetBorder = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[server]
maxUploadSize = 80
runOnSave = false

[browser]
gatherUsageStats = false
